name: Checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python_arch: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - run: python -m pip install -r packaging/requirements-build.txt
      - name: Python and shell checks
        run: |
          python -B -m unittest discover -s tests -v
          for script in core/*.sh tools/*.sh migrations/*.sh scripts/*.sh; do
            bash -n "$script" || exit 1
          done
      - name: Native tests
        run: xcodebuild test -project app/StorageUtility.xcodeproj -scheme StorageUtility -destination 'platform=macOS' -derivedDataPath build/swift-tests
      - name: Native UI flows with isolated fixtures
        run: xcodebuild test -project app/StorageUtility.xcodeproj -scheme StorageFlows -destination 'platform=macOS' -derivedDataPath build/ui-tests
      - name: Build and verify self-contained bundle
        env:
          COSTOLA_ARCH: ${{ matrix.architecture }}
          COSTOLA_PYTHON: python
        run: |
          scripts/build-app.sh
          COSTOLA_APP="$PWD/build/$COSTOLA_ARCH/Xcode/Build/Products/Debug/Costola.app"
          export COSTOLA_APP
          scripts/verify-package.sh "$COSTOLA_APP" "$COSTOLA_ARCH"
          python -B -m unittest discover -s tests/macos -p test_copy_fidelity.py -v
          python -B -m unittest discover -s tests/macos -p test_packaged_worker.py -v
          python -B -m unittest discover -s tests/macos -p test_background_lifecycle.py -v
          python -B -m unittest discover -s tests/macos -p test_service_registration.py -v
          COSTOLA_STORAGE_INTEGRATION=1 python -B -m unittest discover -s tests/macos -p test_storage_roundtrip.py -v
